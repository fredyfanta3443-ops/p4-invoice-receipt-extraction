[project]
name = "invoice-extraction"
version = "0.1.0"
description = "Invoice and receipt extraction with confidence routing"
readme = "README.md"
authors = [
    { name = "Moshiur Rahman Sifat", email = "sifatami596@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.10.0",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
invoice-extraction = "invoice_extraction.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
